# Tux Burner is a fork of PenguinBurner by jpietek (GPL-3.0-or-later).
#
# Build and release Tux Burner packages.
#
#   * Push a tag like v0.99  -> builds everything and, only if every build passed,
#     creates the GitHub release with the files attached.
#   * "Run workflow" (workflow_dispatch) -> same builds, NO release: the files stay
#     as downloadable artifacts of the run.
#
# Release files: Arch .pkg.tar.zst, .deb, .rpm, the source tarball, the user guide PDF and
# SHA256SUMS. (No AppImage: Tux Burner needs a root daemon and a Vulkan layer installed on
# the host, which an AppImage cannot provide.)
#
# The deb and rpm jobs have NOT been run yet when this file was written; expect to fix small
# things on the first "Run workflow" before tagging.

name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and check it against the tag
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(packaging/release-info.sh version)
          echo "version in work/pyproject.toml: $VER"
          if [ "$REF_TYPE" = tag ]; then packaging/release-info.sh check "$REF_NAME"; fi
          # the release notes file must exist
          test -s "packaging/release-notes/v$VER.md"
          # the guide PDF must be a real PDF
          [ "$(head -c5 work/docs/user-guide/Tux-Burner-User-Guide.pdf)" = "%PDF-" ]
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Make the source tarball (git archive of work/)
        run: packaging/make-source-tarball.sh source/ HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: source/
          if-no-files-found: error

  arch:
    needs: prepare
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - name: Build the Arch package
        run: packaging/ci-build-arch.sh "source/tux-burner-$VER.tar.gz" out/arch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-arch
          path: out/arch/
          if-no-files-found: error

  deb:
    needs: prepare
    runs-on: ubuntu-latest
    container: debian:13
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - name: Build the .deb
        run: packaging/ci-build-deb.sh "source/tux-burner-$VER.tar.gz" out/deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-deb
          path: out/deb/
          if-no-files-found: error

  rpm:
    needs: prepare
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - run: dnf install -y git tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - name: Build the .rpm
        run: packaging/ci-build-rpm.sh "source/tux-burner-$VER.tar.gz" out/rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-rpm
          path: out/rpm/
          if-no-files-found: error

  assemble:
    needs: [prepare, arch, deb, rpm]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: built/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: built/source/
      - name: Collect the files and write SHA256SUMS
        run: |
          mkdir -p release
          cp built/pkg-*/* built/source/*.tar.gz release/
          # debug-symbol packages are built next to the real ones; they are not release files
          rm -f release/*-debug-*.pkg.tar.* release/*dbgsym*.deb release/*debuginfo*.rpm release/*debugsource*.rpm
          cp work/docs/user-guide/Tux-Burner-User-Guide.pdf release/
          (cd release && sha256sum -- * > SHA256SUMS)
          # arch + deb + rpm + source tarball + PDF + SHA256SUMS
          n=$(find release -type f | wc -l)
          [ "$n" -eq 6 ] || { echo "::error::expected 6 release files, got $n"; ls -l release; exit 1; }
          ls -l release; cat release/SHA256SUMS
      - name: Release notes
        run: |
          packaging/release-info.sh notes "v$VER" > release-notes.md
          packaging/release-info.sh title "v$VER" > release-title.txt
          cat release-title.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/
            release-notes.md
            release-title.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: .
      - name: Create the release
        run: |
          ls -l release
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" = true ]; then
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --title "$(cat release-title.txt)" --notes-file release-notes.md --draft=false
            else
              echo "::error::release $TAG is already published; delete it first to rebuild"
              exit 1
            fi
          else
            gh release create "$TAG" release/* --verify-tag \
              --title "$(cat release-title.txt)" --notes-file release-notes.md
          fi
